[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peacook"
version = "0.1.0"
description = "Extraction d'architecture d'environnements UVM (SystemVerilog) vers schémas et modèles JSON"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyslang>=9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
peacook = "peacook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
peacook = ["frontend/stubs/*.svh", "render/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
